[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdos"
version = "1.0.0"
description = "CivicDividendOS: attribution-based taxation of autonomous economic activity"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
keywords = ["automation", "taxation", "Shapley", "public finance", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.5",
]
figures = [
  "matplotlib==3.8.4",
  "pandas==2.2.2",
]

[project.scripts]
cdos-campaign = "cdos.cli:campaign_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a few seconds",
  "regression: compares against the audited baseline",
]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
